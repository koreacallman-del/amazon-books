<svg viewBox="0 0 100 100" width="520" height="520" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#F6F1E6"/><path d="M62 81.9 C63.58 81.86 68.28 81.73 71.46 81.63 C74.65 81.53 77.92 81.43 81.09 81.29 C84.26 81.16 87.34 80.96 90.49 80.83 C93.65 80.7 98.42 80.56 100 80.5" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/><path d="M50 64.6 C50.03 64.27 50.1 63.28 50.15 62.6 C50.2 61.92 50.26 61.24 50.28 60.53 C50.31 59.81 50.28 59.02 50.3 58.31 C50.33 57.6 50.39 56.94 50.44 56.26 C50.48 55.58 50.54 54.58 50.56 54.24" fill="none" stroke="#A8822F" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.54 54.3 C50.54 54.08 50.52 53.65 50.52 53.02 C50.53 52.4 50.56 50.96 50.57 50.55" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.6 54.3 C50.76 54.2 51.01 54.03 51.52 53.71 C52.03 53.39 53.32 52.61 53.68 52.39" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.55 54.3 C50.73 54.39 51.09 54.57 51.63 54.87 C52.16 55.16 53.4 55.86 53.76 56.06" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.61 54.3 C50.61 54.49 50.6 54.84 50.59 55.44 C50.58 56.04 50.57 57.49 50.56 57.91" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.55 54.3 C50.39 54.39 50.09 54.53 49.56 54.83 C49.02 55.13 47.73 55.9 47.37 56.11" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.61 54.3 C50.44 54.19 50.07 53.96 49.54 53.64 C49.01 53.32 47.8 52.59 47.45 52.38" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M49.86 54.24 a0.7 0.7 0 1 0 1.4 0 a0.7 0.7 0 1 0 -1.4 0 Z" fill="#A8822F"/><text x="16.4" y="24" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">작가의 말</text><text x="16.4" y="30" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">사무실에서 할 일 없이 두 시간을 보낸 날이 있었습니다.</text><text x="16.4" y="36" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">집으로 걸어가는데, 매일 걷던 길이 처음 보는 길 같았습니다.</text><text x="16.4" y="42" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">삼십 년을 같은 자리에서 일했습니다.</text><text x="16.4" y="48" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">아침에 문을 열고 저녁에 문을 닫았습니다.</text><text x="16.4" y="54" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">그게 제 일이었습니다. 오래 그게 저인 줄 알았습니다.</text><text x="16.4" y="60" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">일이 줄어들자 그동안 안 보이던 것들이 보이기 시작했습니다.</text><text x="16.4" y="66" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">바빠서 못 했다고 말해온 것들이</text><text x="16.4" y="72" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">사실은 하지 않은 것이었다는 걸, 그때 알았습니다.</text><text x="16.4" y="78" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">이 책의 주인공은 제가 아닙니다.</text><text x="16.4" y="84" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">하지만 그가 걸은 골목은 제가 걸어본 골목입니다.</text><text x="16.4" y="90" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">쓰는 동안 이야기가 저보다 앞서 갔습니다.</text><text x="16.4" y="96" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">그가 전화를 거는 장면을 쓰고 나서야</text><text x="16.4" y="102" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">저에게도 미뤄둔 전화가 한 통 있다는 걸 알았습니다.</text><text x="16.4" y="108" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">늦었다고 생각해본 적 있는 분께</text><text x="16.4" y="114" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">이 이야기를 드립니다.</text><text x="16.4" y="120" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">늦게 피는 꽃이 오래 간다는 말을,</text><text x="16.4" y="126" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">저도 아직 믿어보는 중입니다.</text><text x="16.4" y="132" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">— 곽 훈 안토니오</text></svg>