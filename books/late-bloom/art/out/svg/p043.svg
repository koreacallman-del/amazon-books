t-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">잘 키운 거라고 생각했다.</text><text x="16.4" y="60" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">저 정도 컸으면 부모 몫은 다 한 거라고.</text></svg>