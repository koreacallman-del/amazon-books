<svg viewBox="0 0 100 100" width="520" height="520" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#F6F1E6"/><path d="M0 88.39 C1.57 88.43 6.24 88.54 9.41 88.64 C12.57 88.74 15.79 88.87 18.98 88.97 C22.17 89.07 25.36 89.16 28.53 89.26 C31.7 89.37 36.42 89.53 38 89.59" fill="none" stroke="#A8822F" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/><path d="M48.51 34 a1.49 1.49 0 1 0 2.99 0 a1.49 1.49 0 1 0 -2.99 0 Z" fill="#A8822F"/><text x="11.9" y="67.1" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">"그때 그 별은 알았을까."</text><text x="11.9" y="73.1" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">"자기 빛이 여기까지 올 줄."</text><text x="11.9" y="79.1" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">아이가 고개를 저었다.</text><text x="11.9" y="85.1" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">"몰랐을 거예요."</text><text x="11.9" y="91.1" text-anchor="start" font-size="3.35" fill="#1C1A17" font-family="Nanum Myeongjo, serif">"그냥 빛나고 있었을 거예요."</text></svg>